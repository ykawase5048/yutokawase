<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page moved — Yuto Kawase</title>
  <link rel="canonical" href="https://ykawase5048.github.io/cv">
  <script>
    // Keep old bookmarks, including PDF links, working after the move.
    const legacyPrefix = '/yutokawase';
    const currentPath = window.location.pathname;
    if (currentPath === legacyPrefix || currentPath.startsWith(legacyPrefix + '/')) {
      const newPath = currentPath.slice(legacyPrefix.length) || '/';
      const cleanPath = newPath === '/index.html'
        ? '/'
        : newPath.replace(/^\/(paper|talk|notes|cv|misc)\.html$/, '/$1');
      window.location.replace(window.location.origin + cleanPath + window.location.search + window.location.hash);
    }
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=https://ykawase5048.github.io/cv"></noscript>
</head>
<body>
  <p>This page has moved to <a href="https://ykawase5048.github.io/cv">https://ykawase5048.github.io/cv</a>.</p>
</body>
</html>
